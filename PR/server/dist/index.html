<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1><i class="fas fa-chart-network"></i> Monitor Dashboard</h1>
                <span id="connection-status" class="status-indicator status-offline">Disconnected</span>
            </div>
            <div class="header-right">
                <button id="refresh-btn" class="btn btn-primary"><i class="fas fa-sync-alt"></i> Refresh</button>
                <div class="auto-refresh">
                    <label for="auto-refresh-select">Auto-refresh:</label>
                    <select id="auto-refresh-select">
                        <option value="0">Off</option>
                        <option value="5">5 sec</option>
                        <option value="10" selected>10 sec</option>
                        <option value="30">30 sec</option>
                        <option value="60">60 sec</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Dashboard Overview -->
        <section class="dashboard-overview">
            <div class="overview-card">
                <div class="card-icon bg-green">
                    <i class="fas fa-plug"></i>
                </div>
                <div class="card-content">
                    <h3 id="online-count">0</h3>
                    <p>Online Agents</p>
                </div>
            </div>
            <div class="overview-card">
                <div class="card-icon bg-red">
                    <i class="fas fa-power-off"></i>
                </div>
                <div class="card-content">
                    <h3 id="offline-count">0</h3>
                    <p>Offline Agents</p>
                </div>
            </div>
            <div class="overview-card">
                <div class="card-icon bg-blue">
                    <i class="fas fa-tachometer-alt"></i>
                </div>
                <div class="card-content">
                    <h3 id="total-hashrate">0 H/s</h3>
                    <p>Total Hashrate</p>
                </div>
            </div>
            <div class="overview-card">
                <div class="card-icon bg-orange">
                    <i class="fas fa-thermometer-half"></i>
                </div>
                <div class="card-content">
                    <h3 id="avg-temp">0°C</h3>
                    <p>Avg Temperature</p>
                </div>
            </div>
        </section>

        <!-- Command Panel -->
        <section class="command-panel">
            <h2><i class="fas fa-terminal"></i> Command Panel</h2>
            <div class="command-controls">
                <div class="selection-mode">
                    <label>
                        <input type="radio" name="selection-mode" value="all" checked> Apply to all
                    </label>
                    <label>
                        <input type="radio" name="selection-mode" value="selected"> Select specific agents
                    </label>
                </div>
                
                <div class="command-selector">
                    <select id="command-select">
                        <option value="">Select command...</option>
                        <option value="start_monitor">Start Mining</option>
                        <option value="stop_monitor">Stop Mining</option>
                        <option value="restart_monitor">Restart Monitor</option>
                        <option value="update_config">Update Config</option>
                        <option value="reboot">Reboot PC</option>
                    </select>
                </div>
                
                <button id="execute-command-btn" class="btn btn-danger" disabled>
                    <i class="fas fa-bolt"></i> Execute
                </button>
            </div>
        </section>

        <!-- Agent List -->
        <section class="agent-list-section">
            <div class="section-header">
                <h2><i class="fas fa-server"></i> Agent List</h2>
                <div class="view-controls">
                    <button id="grid-view-btn" class="btn btn-secondary active">Grid</button>
                    <button id="table-view-btn" class="btn btn-secondary">Table</button>
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Search agents...">
                    </div>
                </div>
            </div>
            
            <div id="agent-grid" class="agent-grid">
                <!-- Agent cards will be populated here -->
            </div>
            
            <table id="agent-table" class="agent-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Select</th>
                        <th>ID</th>
                        <th>Status</th>
                        <th>Platform</th>
                        <th>Hashrate</th>
                        <th>Temperature</th>
                        <th>CPU Load</th>
                        <th>RAM Usage</th>
                        <th>Version</th>
                        <th>Last Seen</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="agent-table-body">
                    <!-- Table rows will be populated here -->
                </tbody>
            </table>
        </section>

        <!-- Charts Panel -->
        <section class="charts-panel">
            <h2><i class="fas fa-chart-bar"></i> Charts</h2>
            <div class="chart-container">
                <canvas id="hashrate-chart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="temperature-chart"></canvas>
            </div>
        </section>

        <!-- Proxy Control Panel -->
        <section class="proxy-panel">
            <h2><i class="fas fa-exchange-alt"></i> Proxy Control</h2>
            <div class="proxy-controls">
                <div class="proxy-status">
                    <span>Status: </span>
                    <span id="proxy-status">Unknown</span>
                </div>
                <div class="proxy-buttons">
                    <button id="start-proxy-btn" class="btn btn-success">Start Proxy</button>
                    <button id="stop-proxy-btn" class="btn btn-warning">Stop Proxy</button>
                    <button id="restart-proxy-btn" class="btn btn-info">Restart Proxy</button>
                    <button id="view-logs-btn" class="btn btn-secondary">View Logs</button>
                </div>
            </div>
        </section>
    </div>

    <!-- Notifications Container -->
    <div id="notifications" class="notifications"></div>

    <!-- Agent Detail Modal -->
    <div id="agent-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Agent Details</h2>
            <div id="agent-details">
                <!-- Agent details will be populated here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
